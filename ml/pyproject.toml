[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subspot-ml"
version = "0.1.0"
description = "Data pipeline, models and backtests for Subspot's Premier League forecasts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# Pulled in once the PyTorch model lands (phase 3), kept out of CI until then.
torch = ["torch>=2.4", "coremltools>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/subspot_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "NPY"]
