name: Feature
description: A new capability or roadmap item
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [engine, ml, ios, infra, docs]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] Tests cover ...
    validations:
      required: true
