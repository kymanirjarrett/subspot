name: Bug
description: Something is wrong or a forecast looks off
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [engine, ml, ios, infra, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or data to reproduce
