name: ML

on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov=subspot_ml --cov-report=term-missing
